<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GST">
<meta name="theme-color" content="#d12b2b">
<link rel="apple-touch-icon" href="/icon.svg">
<link rel="manifest" href="/manifest.json">
<title>Dashboard — GST</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --white:#fff;--bg:#f5f4f2;--bg2:#eeedeb;
  --border:#e4e2de;--border2:#d0cdc8;
  --text:#1a1a1a;--text2:#4a4a4a;--text3:#888;--text4:#c0bdb8;
  --red:#d12b2b;--red2:#b32222;--red-bg:#fef2f2;--red-border:#fad4d4;
  --blk:#111;
  --green:#15a34a;--green-bg:#f0fdf4;--green-border:#bbf7d0;
  --gold:#c9841a;--gold-bg:#fffbf0;--gold-border:#f0d88a;
  --blue:#2563eb;--blue-bg:#eff6ff;
  --r:8px;--r2:5px;
  --s1:0 1px 3px rgba(0,0,0,.06);--s2:0 4px 12px rgba(0,0,0,.08);
}
body.dark{
  --white:#1e1e1e;--bg:#141414;--bg2:#252525;
  --border:#2e2e2e;--border2:#3d3d3d;
  --text:#e8e6e3;--text2:#9a9794;--text3:#5a5752;--text4:#2e2c29;
  --blk:#e8e6e3;
  --red-bg:#2d1010;--red-border:#5a2020;
  --gold-bg:#231a08;--gold-border:#4a3510;
  --green-bg:#0b2016;--green-border:#1a4028;
  --blue-bg:#0d1a35;
  --s1:0 1px 3px rgba(0,0,0,.25);--s2:0 4px 12px rgba(0,0,0,.35);
}
body.dark #sidebar{background:#1e1e1e;border-right-color:#2e2e2e;}
body.dark .sb-brand{border-bottom-color:#2e2e2e;}
body.dark .sb-brand:hover{background:#252525;}
body.dark .sb-brand-name{color:#e8e6e3;}
body.dark .sb-item{color:#9a9794;}
body.dark .sb-item:hover{color:#e8e6e3;background:#252525;}
body.dark .sb-item.active{color:#d12b2b;background:#2d1010;border-left-color:#d12b2b;}
body.dark .sb-sep{background:#2e2e2e;}
body.dark .sb-bottom{border-top-color:#2e2e2e !important;}
.btn-dark{background:none;border:1px solid var(--border);width:30px;height:30px;border-radius:6px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:14px;transition:all .15s;flex-shrink:0;}
.btn-dark:hover{border-color:var(--red);}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Poppins',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:13px;-webkit-font-smoothing:antialiased;padding-left:200px;}
button,input,select{font-family:'Poppins',sans-serif;}

/* SIDEBAR */
#sidebar{position:fixed;left:0;top:0;bottom:0;width:200px;background:#fff;border-right:1px solid #e4e2de;z-index:400;display:flex;flex-direction:column;transition:width .25s ease;}
.sb-brand{height:52px;display:flex;align-items:center;padding:0 20px;border-bottom:1px solid #e4e2de;flex-shrink:0;cursor:pointer;user-select:none;}
.sb-brand:hover{background:#f5f4f2;}
.sb-brand-name{font-size:14px;font-weight:700;color:#1a1a1a;letter-spacing:.05em;}
.sb-brand-name em{color:#d12b2b;font-style:normal;}
.sb-nav{padding:10px 0;flex:1;}
.sb-item{display:flex;align-items:center;gap:12px;padding:10px 20px;color:#4a4a4a;text-decoration:none;font-size:13px;font-weight:600;letter-spacing:.03em;border-left:3px solid transparent;transition:all .15s;}
.sb-item:hover{color:#1a1a1a;background:#f5f4f2;}
.sb-item.active{color:#d12b2b;background:#fef2f2;border-left-color:#d12b2b;}
.sb-icon{font-size:16px;width:20px;text-align:center;flex-shrink:0;}
.sb-sep{height:1px;background:#e4e2de;margin:6px 0;}
#sidebar.collapsed{width:60px;overflow:hidden;}
#sidebar.collapsed .sb-label{display:none;}
#sidebar.collapsed .sb-item{justify-content:center;padding:10px 0;}
#sidebar.collapsed .sb-brand{padding:0;justify-content:center;}
#sidebar.collapsed .sb-bottom{display:none;}
#sb-toggle{display:none;}
body{transition:padding-left .25s ease;}
body.sb-collapsed{padding-left:60px;}
#sb-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:390;}
.sb-hamburger{display:none;background:#d12b2b;border:none;border-radius:8px;width:38px;height:38px;cursor:pointer;align-items:center;justify-content:center;color:#fff;font-size:18px;box-shadow:0 2px 8px rgba(0,0,0,.25);flex-shrink:0;-webkit-tap-highlight-color:transparent;touch-action:manipulation;}
@media(max-width:768px){
  #sidebar{left:-220px !important;width:200px !important;transition:left .25s ease;top:0;}
  #sidebar.mobile-open{left:0 !important;}
  #sb-overlay.active{display:block;}
  body,body.sb-collapsed{padding-left:0 !important;}
  .sb-hamburger{display:flex;margin-right:10px;}
  #sb-toggle{display:none;}
  body{font-size:13px;}
  .dash-content{grid-template-columns:1fr !important;padding:12px;gap:12px;}
  .card{border-radius:8px;min-width:0;width:100%;}
  .gst-ov-grid{grid-template-columns:repeat(2,1fr);}
  .chart-wrap canvas{min-width:0;width:100%;}
  .porto-meta{grid-template-columns:1fr 1fr;}
  .porto-item{padding:8px 12px;font-size:11px;}
}

/* PAGE HEADER */
.page-hdr{background:var(--white);border-bottom:1px solid var(--border);height:52px;padding:0 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
.page-title{font-size:14px;font-weight:700;color:var(--blk);}
.page-date{font-size:11px;color:var(--text3);}

/* CONTENT */
.dash-content{padding:20px 24px;display:grid;grid-template-columns:repeat(3,1fr);gap:16px;align-content:start;}

/* CARD */
.card{background:var(--white);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--s1);overflow:hidden;}
.card-hdr{padding:12px 16px 10px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.card-title{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text2);}
.card-tag{font-size:9px;padding:2px 8px;border-radius:20px;font-weight:600;letter-spacing:.03em;}
.card-tag.red{background:var(--red-bg);color:var(--red);border:1px solid var(--red-border);}
.card-tag.green{background:var(--green-bg);color:var(--green);border:1px solid var(--green-border);}
.card-tag.gold{background:var(--gold-bg);color:var(--gold);border:1px solid var(--gold-border);}
.card-body{padding:16px;}

/* GST OVERVIEW (red box) */
.gst-ov{background:var(--red);border-radius:8px;padding:14px 16px;margin-bottom:12px;}
.gst-ov-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.gst-ov-title{font-size:9px;font-weight:700;letter-spacing:.12em;color:#fff;text-transform:uppercase;}
.gst-ov-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;}
.gst-ov-box{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);border-radius:var(--r2);padding:9px 10px 7px;transition:all .15s;}
.gst-ov-box.click{cursor:pointer;}
.gst-ov-box.click:hover{border-color:rgba(255,255,255,.4);transform:translateY(-1px);}
.gst-ov-val{font-size:20px;font-weight:700;color:#fff;line-height:1;}
.gst-ov-val.gold{color:#fde68a;}
.gst-ov-val.muted{color:#fecaca;}
.gst-ov-lbl{font-size:8px;font-weight:500;color:rgba(255,255,255,.65);margin-top:2px;text-transform:uppercase;letter-spacing:.04em;}
/* GST filter */
.gst-filter{font-family:'Poppins',sans-serif;font-size:9px;font-weight:700;padding:3px 10px;border-radius:20px;border:1px solid var(--border);background:var(--bg);color:var(--text2);cursor:pointer;transition:all .15s;letter-spacing:.04em;}
.gst-filter.gst-active{background:var(--blk);color:#fff;border-color:var(--blk);}
/* GST modal */
.gst-moverlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:500;align-items:center;justify-content:center;padding:16px;}
.gst-modal{background:#fff;border-radius:12px;width:100%;max-width:460px;max-height:82vh;display:flex;flex-direction:column;box-shadow:0 12px 40px rgba(0,0,0,.18);}
.gst-mhdr{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--border);flex-shrink:0;}
.gst-mtitle{font-size:13px;font-weight:700;}
.gst-mbody{padding:4px 16px 16px;overflow-y:auto;}
.gst-mclose{background:none;border:none;cursor:pointer;font-size:16px;color:var(--text3);line-height:1;padding:2px;}
.chart-wrap{position:relative;height:150px;}

/* FINANCE */
.fin-row{display:flex;align-items:center;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--border);}
.fin-row:last-child{border-bottom:none;}
.fin-label{font-size:10px;color:var(--text3);font-weight:500;display:flex;align-items:center;gap:6px;}
.fin-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.fin-val{font-size:12px;font-weight:700;color:var(--text);}
.fin-val.green{color:var(--green);}
.fin-val.red{color:var(--red);}
.fin-bar-wrap{margin-top:12px;}
.fin-bar-lbl{display:flex;justify-content:space-between;margin-bottom:5px;}
.fin-bar-key{font-size:9px;color:var(--text3);letter-spacing:.06em;text-transform:uppercase;}
.fin-bar-pct{font-size:9px;font-weight:700;color:var(--green);}
.fin-bar-pct.neg{color:var(--red);}
.fin-bar{height:5px;background:var(--border);border-radius:3px;overflow:hidden;}
.fin-bar-fill{height:100%;background:var(--green);border-radius:3px;transition:width .5s;}
.fin-bar-fill.neg{background:var(--red);}

/* PORTFOLIO */
.porto-total{text-align:center;padding:14px 16px 10px;border-bottom:1px solid var(--border);}
.porto-total-val{font-size:22px;font-weight:700;color:var(--green);}
.porto-total-lbl{font-size:9px;color:var(--text3);margin-top:2px;letter-spacing:.06em;text-transform:uppercase;}
.porto-meta{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--border);}
.porto-meta-item{padding:10px 16px;border-right:1px solid var(--border);}
.porto-meta-item:last-child{border-right:none;}
.porto-meta-lbl{font-size:8px;color:var(--text3);letter-spacing:.06em;text-transform:uppercase;margin-bottom:3px;}
.porto-meta-val{font-size:12px;font-weight:700;color:var(--text);}
.porto-meta-val.green{color:var(--green);}
.porto-meta-val.red{color:var(--red);}
.porto-asset-row{display:flex;align-items:center;justify-content:space-between;padding:7px 16px;border-bottom:1px solid var(--border);transition:background .1s;}
.porto-asset-row:last-child{border-bottom:none;}
.porto-asset-row:hover{background:var(--bg);}
.porto-asset-name{font-size:11px;font-weight:600;color:var(--text);display:flex;align-items:center;gap:7px;}
.porto-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.porto-asset-val{font-size:11px;font-weight:700;color:var(--text);}
.porto-asset-val.zero{color:var(--text4);font-weight:400;}

.loading{text-align:center;padding:20px;color:var(--text4);font-size:11px;font-style:italic;}
</style>
</head>
<body><script>if(localStorage.getItem('gst_theme')==='dark')document.body.classList.add('dark');</script>

<aside id="sidebar">
  <div class="sb-brand"><span class="sb-brand-name">GST<em>.</em></span></div>
  <nav class="sb-nav">
    <a href="/dashboard.html" class="sb-item active"><span class="sb-icon">⊞</span><span class="sb-label">Dashboard</span></a>
    <div class="sb-sep"></div>
    <a href="/legacy.html" class="sb-item"><span class="sb-icon">◎</span><span class="sb-label">GST</span></a>
    <a href="/finance.html" class="sb-item"><span class="sb-icon">◈</span><span class="sb-label">Finance</span></a>
    <a href="/portfolio.html" class="sb-item"><span class="sb-icon">◉</span><span class="sb-label">Portfolio</span></a>
  </nav>
  <div class="sb-bottom" style="padding:12px 16px;border-top:1px solid #e4e2de;">
    <div id="sb-user" onclick="openProfileModal()" title="Edit profil" style="font-size:10px;color:#888;margin-bottom:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;"></div>
    <button onclick="logout()" style="width:100%;background:none;border:1px solid #e4e2de;padding:6px;border-radius:5px;font-family:'Poppins',sans-serif;font-size:10px;font-weight:600;color:#4a4a4a;cursor:pointer;letter-spacing:.04em;transition:all .15s;" onmouseover="this.style.background='#f5f4f2'" onmouseout="this.style.background='none'">Logout</button>
  </div>
</aside>

<div class="page-hdr">
  <button class="sb-hamburger">☰</button>
  <div class="page-title">Dashboard</div>
  <div style="display:flex;align-items:center;gap:10px;">
    <button class="btn-dark" id="btn-dark" onclick="toggleDark()" title="Toggle dark mode">🌙</button>
    <div class="page-date" id="page-date"></div>
  </div>
</div>

<div class="dash-content">

  <!-- GST Card -->
  <div class="card">
    <div class="card-hdr">
      <span class="card-title">GST Progress</span>
      <span class="card-tag red" id="gst-tag">Bulan Ini</span>

      <div class="gst-ov">
        <div class="gst-ov-hdr">
          <div class="gst-ov-title">Overview</div>
          <canvas id="dash-clock" width="32" height="32" style="border-radius:50%;background:#fff;flex-shrink:0;"></canvas>
        </div>
        <div class="gst-ov-grid">
          <div class="gst-ov-box"><div class="gst-ov-val" id="ov-hari">—</div><div class="gst-ov-lbl">Hari</div></div>
          <div class="gst-ov-box click" onclick="openGSTModal('dream')"><div class="gst-ov-val" id="ov-dream">—</div><div class="gst-ov-lbl">Dream</div></div>

          <div class="gst-ov-box click" onclick="openGSTModal('goals')"><div class="gst-ov-val muted" id="ov-left">—</div><div class="gst-ov-lbl">Left</div></div>

  <!-- Finance Card -->

    <div class="card-body">

    </div>

</div>

<script>
const DAYS = 14;
const ACT_CATS = [
  {key:'religion',  label:'Religion',      color:'rgba(59,130,246,.85)'},
  {key:'work',      label:'Working Stage', color:'rgba(239,68,68,.85)'},
  {key:'personal',  label:'Personal Wish', color:'rgba(245,158,11,.85)'},
  {key:'exercise',  label:'Exercise',      color:'rgba(34,197,94,.85)'},
  {key:'habit',     label:'Habit',         color:'rgba(139,92,246,.85)'},
  {key:'humanity',  label:'Humanity',      color:'rgba(20,184,166,.85)'},
];
const PORTO_COLORS = ['#3b82f6','#ef4444','#f59e0b','#10b981','#8b5cf6','#06b6d4','#ec4899'];
let dashAllocChart=null,portoHidden=false,finHidden=false;
let gstData={},gstChart=null,gstFilter='month';

function fmt(n){return 'Rp '+Math.round(n).toLocaleString('id-ID');}
function fmtShort(n){
  if(n>=1000000000) return 'Rp '+(n/1000000000).toFixed(2)+'M';
  if(n>=1000000)    return 'Rp '+(n/1000000).toFixed(1)+'jt';
  return fmt(n);
}
function currentMonth(){
  const d=new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
}
function lastNDates(n){
  const dates=[];
  for(let i=n-1;i>=0;i--){
    const d=new Date();d.setDate(d.getDate()-i);
    dates.push(d.toISOString().slice(0,10));
  }
  return dates;
}

async function logout(){await fetch('/api/auth',{method:'DELETE'});location.href='/login';}

async function init(){
  fetch('/api/auth/me').then(r=>r.ok?r.json():null).then(u=>{if(u){const el=document.getElementById('sb-user');if(el)el.textContent=u.name;}}).catch(()=>{});
  document.getElementById('page-date').textContent =
    new Date().toLocaleDateString('id-ID',{weekday:'long',year:'numeric',month:'long',day:'numeric'});

  const [gst, txs, allTxs, assets, positions] = await Promise.all([
    fetch('/api/data').then(r=>r.json()).catch(()=>({})),
    fetch('/api/transactions?month='+currentMonth()).then(r=>r.json()).catch(()=>[]),
    fetch('/api/transactions').then(r=>r.json()).catch(()=>[]),
    fetch('/api/portfolio/assets').then(r=>r.json()).catch(()=>[]),
    fetch('/api/portfolio/positions').then(r=>r.json()).catch(()=>[]),
  ]);

  renderGST(gst);
  renderFinance(txs);

  const investTxs = (allTxs||[]).filter(t=>t.type==='investment'&&t.category==='Deposit'&&t.asset_id);
  const activePos = (positions||[]).filter(p=>p.is_active&&Number(p.qty)>0);

  const symbols = [];
  activePos.forEach(p=>{
    if(p.ticker_type==='stock_idr') symbols.push(p.ticker+'.JK');
    else if(p.ticker_type==='crypto') symbols.push(p.ticker+'-USD');
    else symbols.push(p.ticker);
  });
  const needsUsd = assets.some(a=>a.is_active&&a.currency==='USD') || activePos.some(p=>p.ticker_type==='crypto');
  if(needsUsd) symbols.push('USDIDR=X');

  if(symbols.filter(s=>s!=='USDIDR=X').length){
    fetch('/api/portfolio/market-price?tickers='+[...new Set(symbols)].join(','))
      .then(r=>r.json()).then(data=>{
        const prices={};
        let usdRate=0;
        (data.prices||[]).forEach(p=>{
          if(p.symbol==='USDIDR=X') usdRate=p.price;
          else prices[p.ticker]=p;
        });
        renderPortfolio(assets, activePos, prices, usdRate, investTxs);
      }).catch(()=>renderPortfolio(assets, activePos, {}, 0, investTxs));
  } else {
    renderPortfolio(assets, activePos, {}, 0, investTxs);
  }
}

const MN_SHORT=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];

function renderGST(data){
  gstData=data;
  const entries  = data.entries  || [];
  const wishes   = data.wishes   || [];
  const goals    = data.goals    || [];
  const lessons  = (data.lessons || []).reduce((n,l)=>{try{return n+(JSON.parse(l.text)||[]).length;}catch{return n;}},0);
  const now=new Date();
  const eoy=new Date(now.getFullYear(),11,31);
  const daysLeft=Math.ceil((eoy-now)/86400000);

  document.getElementById('ov-hari').textContent   = entries.length;
  document.getElementById('ov-dream').textContent  = wishes.length;
  document.getElementById('ov-lesson').textContent = lessons;
  document.getElementById('ov-left').textContent   = daysLeft;

  startDashClock();
  renderGSTChart(gstFilter);
}

function startDashClock(){
  const canvas=document.getElementById('dash-clock');
  if(!canvas)return;
  const draw=()=>{
    const ctx=canvas.getContext('2d'),n=new Date();
    const w=canvas.width,cx=w/2,cy=w/2,r=cx-1.5;
    ctx.clearRect(0,0,w,w);
    ctx.beginPath();ctx.arc(cx,cy,r,0,2*Math.PI);ctx.fillStyle='#fff';ctx.fill();
    ctx.strokeStyle='#e5e7eb';ctx.lineWidth=1;ctx.stroke();
    const hrs=n.getHours()%12,mins=n.getMinutes(),secs=n.getSeconds();
    const ha=(hrs*30+mins*0.5)*Math.PI/180;
    ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(cx+(r*.5)*Math.sin(ha),cy-(r*.5)*Math.cos(ha));
    ctx.strokeStyle='#111';ctx.lineWidth=2;ctx.lineCap='round';ctx.stroke();
    const ma=(mins*6+secs*.1)*Math.PI/180;
    ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(cx+(r*.72)*Math.sin(ma),cy-(r*.72)*Math.cos(ma));
    ctx.strokeStyle='#374151';ctx.lineWidth=1.5;ctx.lineCap='round';ctx.stroke();
    ctx.beginPath();ctx.arc(cx,cy,2.5,0,2*Math.PI);ctx.fillStyle='#d12b2b';ctx.fill();
  };
  draw();
  if(!window._dashClockTimer)window._dashClockTimer=setInterval(draw,1000);
}

function renderGSTChart(filter){
  gstFilter=filter;
  const activities=gstData.activities||[];
  let labels=[],dates=[];
  const now=new Date(),yr=now.getFullYear(),mo=now.getMonth();

  if(filter==='month'){
    const daysInMonth=new Date(yr,mo+1,0).getDate();
    const prefix=`${yr}-${String(mo+1).padStart(2,'0')}`;
    dates=Array.from({length:daysInMonth},(_,i)=>`${prefix}-${String(i+1).padStart(2,'0')}`);
    labels=dates.map(d=>d.slice(8));
    document.getElementById('gst-tag').textContent=MN_SHORT[mo]+' '+yr;
  } else {
    // YTD: daily from Jan 1 of current year to today (local date, not UTC)
    const start=new Date(yr,0,1);
    const end=new Date(yr,mo,now.getDate());
    for(let d=new Date(start);d<=end;d.setDate(d.getDate()+1)){
      const s=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
      dates.push(s);
      labels.push(d.getDate()===1?MN_SHORT[d.getMonth()]:'');
    }
    document.getElementById('gst-tag').textContent='YTD '+yr;
  }

  const datasets=ACT_CATS.map(c=>({
    label:c.label,
    data:dates.map(d=>activities.filter(a=>a.date===d&&a.category===c.key).length),
    backgroundColor:c.color,borderRadius:2,stack:'s'
  }));

  if(gstChart){gstChart.destroy();gstChart=null;}
  gstChart=new Chart(document.getElementById('gst-chart'),{
    type:'bar',data:{labels,datasets},
    options:{
      responsive:true,maintainAspectRatio:false,
      plugins:{legend:{display:false},tooltip:{
        mode:'index',intersect:false,
        callbacks:{title:ctx=>dates[ctx[0].dataIndex]||''}
      }},
      scales:{
        x:{stacked:true,grid:{display:false},ticks:{font:{family:'Poppins',size:8},color:'#aaa',maxRotation:0,autoSkip:false}},
        y:{stacked:true,grid:{color:'rgba(0,0,0,.04)'},ticks:{font:{family:'Poppins',size:8},color:'#aaa'},min:0},
      }
    }
  });
}

function setGSTFilter(f,btn){
  document.querySelectorAll('.gst-filter').forEach(b=>{b.classList.remove('gst-active');});
  btn.classList.add('gst-active');
  renderGSTChart(f);
}

function openGSTModal(type){
  const overlay=document.getElementById('gst-moverlay');
  const title=document.getElementById('gst-mtitle');
  const body=document.getElementById('gst-mbody');
  overlay.style.display='flex';

  if(type==='dream'){
    title.textContent='✦ Dream List';
    const wishes=gstData.wishes||[];
    const done=wishes.filter(w=>w.done),undone=wishes.filter(w=>!w.done);
    const row=w=>`<div style="padding:10px 0;border-bottom:1px solid var(--border);display:flex;gap:10px;">
      <span style="font-size:14px;margin-top:1px;color:${w.done?'var(--green)':'var(--text4)'};">${w.done?'✓':'○'}</span>
      <div>
        <div style="font-size:12px;font-weight:600;color:${w.done?'var(--text3)':'var(--text)'};">${w.text}</div>
        ${w.done&&w.achievement_story?`<div style="font-size:10px;color:var(--text3);margin-top:3px;font-style:italic;">${w.achievement_story}</div>`:''}
      </div>
    </div>`;
    body.innerHTML=undone.map(row).join('')+(done.length?`<div style="font-size:9px;font-weight:700;letter-spacing:.08em;color:var(--text3);margin:12px 0 4px;text-transform:uppercase;">Tercapai</div>`+done.map(row).join(''):'')
      ||'<div style="text-align:center;padding:24px;color:var(--text4);">Belum ada dream.</div>';

  } else if(type==='lesson'){
    title.textContent='Lessons This Year';
    const yr=new Date().getFullYear();
    const allItems=[];
    (gstData.lessons||[]).forEach(l=>{try{(JSON.parse(l.text)||[]).forEach(it=>allItems.push(it));}catch{}});
    const thisYear=allItems.filter(it=>!it.ts||new Date(it.ts).getFullYear()===yr).reverse();
    body.innerHTML=thisYear.length
      ?`<div style="font-size:10px;font-weight:700;color:var(--text3);letter-spacing:.06em;margin:10px 0 8px;text-transform:uppercase;">Hidup ${yr} mengajarkan...</div>`
        +thisYear.map(it=>`<div style="padding:9px 0;border-bottom:1px solid var(--border);">
          <div style="font-size:12px;color:var(--text);line-height:1.5;">${it.text}</div>
          ${it.ts?`<div style="font-size:9px;color:var(--text4);margin-top:3px;">${new Date(it.ts).toLocaleDateString('id-ID',{day:'numeric',month:'long'})}</div>`:''}
        </div>`).join('')
      :'<div style="text-align:center;padding:24px;color:var(--text4);">Belum ada lesson tahun ini.</div>';

  } else if(type==='goals'){
    title.textContent='Goals Belum Tercapai';
    const goals=(gstData.goals||[]).filter(g=>!g.done);
    const yr=new Date().getFullYear();
    const annual=goals.filter(g=>g.scope==='year'||(!g.scope&&g.yr===yr));
    const monthly=goals.filter(g=>g.scope==='month');
    const section=(arr,lbl)=>arr.length?`<div style="font-size:9px;font-weight:700;color:var(--text3);letter-spacing:.06em;margin:10px 0 4px;text-transform:uppercase;">${lbl}</div>`
      +arr.map(g=>`<div style="padding:8px 0;border-bottom:1px solid var(--border);">
        <div style="font-size:12px;font-weight:600;color:var(--text);">${g.text}</div>
        ${g.ym?`<div style="font-size:9px;color:var(--text4);margin-top:2px;">${g.ym}</div>`:''}
      </div>`).join(''):'';
    body.innerHTML=section(annual,'Tahunan')+section(monthly,'Bulanan')
      ||'<div style="text-align:center;padding:24px;color:var(--text4);">Semua goals tercapai! 🎉</div>';
  }
}

}

function renderFinance(txs){
  window._lastFinTxs=txs;
  let income=0, expense=0, invest=0, deposit=0;
  (txs||[]).forEach(t=>{
    const a = Number(t.amount)||0;
    if(t.type==='income')           income  += a;
    else if(t.type==='expense')     expense += a;
    else if(t.type==='investment'){
      invest += a;
      if(t.category==='Deposit') deposit += a;
    }
  });
  const sisa = income - expense - invest;
  const rate = income>0 ? Math.round((deposit/income)*100) : 0;
  const neg  = rate < 0;

  const month = new Date().toLocaleDateString('id-ID',{month:'long',year:'numeric'});
  document.getElementById('fin-tag').textContent = month;
  const h=finHidden;
  const mask='••••••';
  document.getElementById('fin-rate').textContent = h?mask:rate+'%';
  document.getElementById('fin-rate').className = 'fin-bar-pct'+(neg?' neg':'');
  const fill = document.getElementById('fin-bar-fill');
  fill.style.width = h?'0%':Math.max(0,Math.min(100,Math.abs(rate)))+'%';
  if(neg) fill.classList.add('neg');

  var dailyHtml='';
  var endStr=localStorage.getItem('gst_budget_end')||'';
  if(endStr){
    var today=new Date();today.setHours(0,0,0,0);
    var end=new Date(endStr+'T00:00:00');
    var diff=Math.ceil((end-today)/(1000*60*60*24));
    if(diff>0){
      var daily=Math.round(sisa/diff);
      dailyHtml=`<div class="fin-row" style="background:var(--bg);border-radius:4px;padding:7px 8px;margin-top:2px;">
        <span class="fin-label" style="font-size:9px;">Est. Harian <span style="color:var(--text4);">(${diff}d)</span></span>
        <span class="fin-val ${daily>0?'green':'red'}" style="font-size:11px;">${h?mask:fmtShort(Math.abs(daily))}</span>
      </div>`;
    }
  }
  document.getElementById('fin-rows').innerHTML = `
    <div class="fin-row">
      <span class="fin-label"><span class="fin-dot" style="background:var(--green)"></span>Income</span>
      <span class="fin-val green">${h?mask:fmtShort(income)}</span>
    </div>
    <div class="fin-row">
      <span class="fin-label"><span class="fin-dot" style="background:var(--red)"></span>Life Cost</span>
      <span class="fin-val red">${h?mask:fmtShort(expense)}</span>
    </div>
    <div class="fin-row">
      <span class="fin-label"><span class="fin-dot" style="background:var(--blue)"></span>Investment</span>
      <span class="fin-val">${h?mask:fmtShort(invest)}</span>
    </div>
    <div class="fin-row">
      <span class="fin-label"><span class="fin-dot" style="background:var(--gold)"></span>Sisa</span>
      <span class="fin-val ${sisa>=0?'green':'red'}">${h?mask:fmtShort(Math.abs(sisa))}</span>
    </div>
    ${dailyHtml}
  `;
}

function renderPortfolio(assets, activePos, prices, usdRate, investTxs){
  function mktVal(p){
    const pr = prices[p.ticker]?.price || 0;
    if(!pr) return 0;
    if(p.ticker_type==='stock_idr') return Number(p.qty)*100*pr;
    if(p.ticker_type==='crypto') return Number(p.qty)*pr*usdRate;
    return 0;
  }

  let totalVal=0;
  activePos.forEach(p=>{ totalVal+=mktVal(p); });
  const totalCash = (assets||[]).filter(a=>a.is_active).reduce((s,a)=>{
    const c=Number(a.cash_idle)||0;
    return s + (a.currency==='USD' ? c*usdRate : c);
  },0);
  totalVal += totalCash;

  document.getElementById('porto-tag').textContent = currentMonth();
  const totalEl = document.getElementById('porto-total');
  totalEl.style.color = totalVal>0?'var(--green)':'var(--red)';

  // Merge duplicate tickers for allocation
  const merged={};
  activePos.forEach(p=>{ const mv=mktVal(p); if(mv>0) merged[p.ticker]=(merged[p.ticker]||0)+mv; });
  const labels=Object.keys(merged).sort((a,b)=>merged[b]-merged[a]);
  const values=labels.map(l=>merged[l]);
  if(totalCash>0){labels.push('Cash');values.push(totalCash);}

  const raw=fmt(totalVal);
  const setVis=(hide)=>{
    totalEl.textContent=hide?'••••••':raw;
    const leg=document.getElementById('dash-alloc-legend');
    if(leg)leg.style.visibility=hide?'hidden':'visible';
  };
  setVis(portoHidden);

  // Doughnut chart
  const colors=labels.map((l,i)=>l==='Cash'?'#9ca3af':PORTO_COLORS[i%PORTO_COLORS.length]);
  const canvas=document.getElementById('dash-alloc-chart');
  if(dashAllocChart){dashAllocChart.destroy();dashAllocChart=null;}
  if(values.length&&canvas){
    dashAllocChart=new Chart(canvas,{
      type:'doughnut',
      data:{labels,datasets:[{data:values,backgroundColor:colors,borderWidth:2,borderColor:'#fff'}]},
      options:{
        responsive:true,maintainAspectRatio:false,cutout:'62%',
        plugins:{
          legend:{display:false},
          tooltip:{callbacks:{label:ctx=>`${ctx.label}: ${fmt(ctx.raw)} (${(ctx.raw/totalVal*100).toFixed(1)}%)`}}
        }
      }
    });
  }

  // Legend
  const leg=document.getElementById('dash-alloc-legend');
  if(leg)leg.innerHTML=labels.map((l,i)=>{
    const v=values[i],pct=(v/totalVal*100).toFixed(1),col=colors[i];
    return`<div style="display:flex;align-items:center;justify-content:space-between;padding:4px 0;border-bottom:1px solid var(--border);">
      <div style="display:flex;align-items:center;gap:7px;">
        <span style="width:7px;height:7px;border-radius:50%;background:${col};flex-shrink:0;display:inline-block;"></span>
        <span style="font-size:10px;font-weight:600;color:var(--text);">${l}</span>
      </div>
      <div>
        <span style="font-size:10px;font-weight:700;color:${l==='Cash'?'var(--gold)':'var(--text)'};">${fmtShort(v)}</span>
        <span style="font-size:9px;color:var(--text3);margin-left:5px;">${pct}%</span>
      </div>
    </div>`;
  }).join('');
  if(portoHidden&&leg)leg.style.visibility='hidden';
}

function togglePortoHide(){
  portoHidden=!portoHidden;
  document.getElementById('porto-eye').textContent=portoHidden?'🙈':'👁';
