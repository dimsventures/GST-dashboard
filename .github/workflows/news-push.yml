name: Daily News Push

on:
  schedule:
    # 23:00 UTC = 06:00 WIB tiap hari
    - cron: '0 23 * * *'
  # Tombol "Run workflow" di tab Actions buat trigger manual (test / push paksa)
  workflow_dispatch:

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger /api/news/push
        run: |
          code=$(curl -sS -o /tmp/resp.json -w "%{http_code}" -X GET \
            "https://gst-hq.vercel.app/api/news/push" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}")
          echo "HTTP $code"
          cat /tmp/resp.json 2>/dev/null || true
          echo
          # gagal (merah) kalau bukan 200 — biar redirect/error ketauan, bukan false-positive
          test "$code" = "200"
